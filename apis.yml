description: mokSa AI (moksa.ai) is an AI-powered surveillance and video-analytics
  platform that delivers real-time threat detection, automated alerts, and smarter
  operational decision-making from a single intelligent system. The platform integrates
  with existing camera and monitoring infrastructure and applies real-time training
  and analysis to detect security and safety threats across retail spaces, hospitality
  and lodging, educational institutions, fuel and service stations, and food-handling
  environments. mokSa AI states SOC 2 Type 2 certification and GDPR compliance for
  its data handling. The company was surfaced as a Techstars portfolio company and
  added to the API Evangelist network. No public API, developer documentation, or
  SDK surface was found during enrichment.
